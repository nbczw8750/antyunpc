name: Deploy to GitHub Pages

# 推送到 main 分支时自动构建并发布到 GitHub Pages。
# 首次使用前：仓库 Settings → Pages → Source 选择「GitHub Actions」。
# 注意：astro.config.mjs 中的 GITHUB_USERNAME / GITHUB_REPO 必须先替换为真实值，
# 否则 base 与仓库名不一致，部署后全站样式与页内锚点都会 404。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务，未完成的旧任务不取消，避免发布到一半中断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4